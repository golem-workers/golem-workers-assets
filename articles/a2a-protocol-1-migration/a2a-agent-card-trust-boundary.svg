<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1729"/><stop offset="1" stop-color="#172642"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7adcca"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="85" y="105" fill="#f6f8ff" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="700">Agent Card trust boundary</text>
  <text x="85" y="155" fill="#b6c3df" font-family="Inter,Arial,sans-serif" font-size="25">Discovery metadata starts a decision; it never grants authority by itself.</text>
  <g filter="url(#shadow)">
    <rect x="85" y="290" width="330" height="330" rx="34" fill="#1a3150" stroke="#5d7ea8" stroke-width="2"/>
    <rect x="635" y="245" width="330" height="420" rx="34" fill="#113c46" stroke="#62d8c4" stroke-width="3"/>
    <rect x="1185" y="290" width="330" height="330" rx="34" fill="#3d2d43" stroke="#a983aa" stroke-width="2"/>
  </g>
  <circle cx="250" cy="390" r="64" fill="#294d79"/><path d="M220 395l24 24 48-58" fill="none" stroke="#bde3ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="250" y="500" text-anchor="middle" fill="#eef7ff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">Discover</text>
  <text x="250" y="540" text-anchor="middle" fill="#bcd0e4" font-family="Inter,Arial,sans-serif" font-size="22">fetch + cache</text>
  <circle cx="800" cy="365" r="64" fill="#1b6b70"/><path d="M800 325v80M760 365h80" stroke="#cafff7" stroke-width="12" stroke-linecap="round"/>
  <text x="800" y="485" text-anchor="middle" fill="#effffc" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">Verify + constrain</text>
  <text x="800" y="532" text-anchor="middle" fill="#b9e5df" font-family="Inter,Arial,sans-serif" font-size="22">signature / TLS / issuer</text>
  <text x="800" y="568" text-anchor="middle" fill="#b9e5df" font-family="Inter,Arial,sans-serif" font-size="22">protocol / scopes / tenant</text>
  <text x="800" y="604" text-anchor="middle" fill="#b9e5df" font-family="Inter,Arial,sans-serif" font-size="22">rate / risk / approval</text>
  <circle cx="1350" cy="390" r="64" fill="#674a6c"/><path d="M1317 390h66M1350 357v66" stroke="#f0d7f2" stroke-width="12" stroke-linecap="round"/>
  <text x="1350" y="500" text-anchor="middle" fill="#fff3ff" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700">Delegate</text>
  <text x="1350" y="540" text-anchor="middle" fill="#d9c3dc" font-family="Inter,Arial,sans-serif" font-size="22">bounded task</text>
  <path d="M430 455H600" stroke="#7adcca" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M980 455H1150" stroke="#7adcca" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="325" y="740" width="950" height="72" rx="36" fill="#162f44" stroke="#607fa0"/>
  <text x="800" y="786" text-anchor="middle" fill="#e5f4ff" font-family="Inter,Arial,sans-serif" font-size="25">A valid card says who and how; policy decides whether and what.</text>
</svg>
