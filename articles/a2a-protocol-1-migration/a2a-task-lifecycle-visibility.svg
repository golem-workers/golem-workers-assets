<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081923"/><stop offset="1" stop-color="#102f36"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#77e4d1"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="85" y="105" fill="#f4fbff" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="700">A2A task lifecycle and visibility</text>
  <text x="85" y="155" fill="#a9cbd3" font-family="Inter,Arial,sans-serif" font-size="25">Every state transition is caller-scoped, tenant-scoped, and auditable.</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="95" y="300" width="270" height="125" rx="25" fill="#1c4850" stroke="#70dccc" stroke-width="2"/>
    <text x="230" y="355" text-anchor="middle" fill="#e8fffb" font-size="25" font-weight="700">SUBMITTED</text>
    <text x="230" y="395" text-anchor="middle" fill="#b9ddd8" font-size="20">new unit of work</text>
    <rect x="505" y="300" width="270" height="125" rx="25" fill="#1c4850" stroke="#70dccc" stroke-width="2"/>
    <text x="640" y="355" text-anchor="middle" fill="#e8fffb" font-size="25" font-weight="700">WORKING</text>
    <text x="640" y="395" text-anchor="middle" fill="#b9ddd8" font-size="20">progress + artifacts</text>
    <rect x="915" y="225" width="270" height="125" rx="25" fill="#4a4030" stroke="#e9bf70" stroke-width="2"/>
    <text x="1050" y="280" text-anchor="middle" fill="#fff5df" font-size="23" font-weight="700">INPUT REQUIRED</text>
    <text x="1050" y="320" text-anchor="middle" fill="#e7d5b2" font-size="20">pause and clarify</text>
    <rect x="915" y="445" width="270" height="125" rx="25" fill="#4a4030" stroke="#e9bf70" stroke-width="2"/>
    <text x="1050" y="500" text-anchor="middle" fill="#fff5df" font-size="23" font-weight="700">AUTH REQUIRED</text>
    <text x="1050" y="540" text-anchor="middle" fill="#e7d5b2" font-size="20">obtain authorization</text>
    <rect x="1325" y="300" width="190" height="125" rx="25" fill="#254838" stroke="#74d59b" stroke-width="2"/>
    <text x="1420" y="355" text-anchor="middle" fill="#ecfff3" font-size="22" font-weight="700">TERMINAL</text>
    <text x="1420" y="395" text-anchor="middle" fill="#c5e7d2" font-size="18">never restart</text>
  </g>
  <path d="M380 362H485" stroke="#77e4d1" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M790 352C840 330 850 290 895 287" fill="none" stroke="#77e4d1" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M790 372C840 405 850 500 895 507" fill="none" stroke="#77e4d1" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M915 275C860 275 840 320 790 320" fill="none" stroke="#e9bf70" stroke-width="6" stroke-dasharray="14 12" marker-end="url(#arrow)"/>
  <path d="M915 520C860 520 840 405 790 405" fill="none" stroke="#e9bf70" stroke-width="6" stroke-dasharray="14 12" marker-end="url(#arrow)"/>
  <text x="840" y="248" text-anchor="middle" fill="#f2d99f" font-family="Inter,Arial,sans-serif" font-size="18">resume</text>
  <text x="845" y="552" text-anchor="middle" fill="#f2d99f" font-family="Inter,Arial,sans-serif" font-size="18">resume</text>
  <path d="M1200 287C1260 300 1265 342 1305 352" fill="none" stroke="#77e4d1" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M1200 507C1260 485 1265 405 1305 375" fill="none" stroke="#77e4d1" stroke-width="8" marker-end="url(#arrow)"/>
  <rect x="260" y="700" width="1080" height="85" rx="42" fill="#113b45" stroke="#5fcdbd"/>
  <text x="800" y="737" text-anchor="middle" fill="#f0fffc" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Visibility filter: authenticated subject + tenant + local authorization</text>
  <text x="800" y="770" text-anchor="middle" fill="#b8ded8" font-family="Inter,Arial,sans-serif" font-size="20">A task ID is not proof that the caller may read, list, subscribe, or cancel it.</text>
