<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#0d3340"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#14384a"/><stop offset="1" stop-color="#0e2737"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#69e6d6"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="100" r="250" fill="#1eb9ad" opacity=".08"/><circle cx="180" cy="820" r="310" fill="#5c7cfa" opacity=".08"/>
  <text x="90" y="105" fill="#f5fbff" font-family="Inter,Arial,sans-serif" font-size="54" font-weight="700">A2A v0.3 to v1.0 migration map</text>
  <text x="90" y="155" fill="#a9c8d6" font-family="Inter,Arial,sans-serif" font-size="25">Upgrade the wire contract, then enforce caller-scoped task visibility.</text>
  <g filter="url(#shadow)">
    <rect x="90" y="235" width="555" height="500" rx="30" fill="url(#card)" stroke="#44677a" stroke-width="2"/>
    <rect x="955" y="235" width="555" height="500" rx="30" fill="url(#card)" stroke="#42d9c8" stroke-width="3"/>
  </g>
  <text x="140" y="310" fill="#ffb86b" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">v0.3 contract</text>
  <text x="1005" y="310" fill="#75f2de" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">v1.0 contract</text>
  <g font-family="ui-monospace,monospace" font-size="24">
    <text x="140" y="385" fill="#d8e6ed">protocolVersion: 0.3</text>
    <text x="140" y="445" fill="#d8e6ed">preferredTransport</text>
    <text x="140" y="505" fill="#d8e6ed">message/send</text>
    <text x="140" y="565" fill="#d8e6ed">role: user</text>
    <text x="140" y="625" fill="#d8e6ed">kind discriminator</text>
    <text x="140" y="685" fill="#d8e6ed">state: completed</text>
    <text x="1005" y="385" fill="#f2fbff">supportedInterfaces[]</text>
    <text x="1005" y="445" fill="#f2fbff">protocolVersion per interface</text>
    <text x="1005" y="505" fill="#f2fbff">SendMessage</text>
    <text x="1005" y="565" fill="#f2fbff">ROLE_USER enum</text>
    <text x="1005" y="625" fill="#f2fbff">text member, no kind</text>
    <text x="1005" y="685" fill="#f2fbff">TASK_STATE_COMPLETED</text>
  </g>
  <path d="M690 465H900" stroke="#69e6d6" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="795" cy="465" r="50" fill="#0e2737" stroke="#69e6d6" stroke-width="4"/>
  <text x="795" y="476" text-anchor="middle" fill="#eafffb" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">1.0</text>
  <rect x="495" y="775" width="610" height="64" rx="32" fill="#163f4b" stroke="#69e6d6"/>
  <text x="800" y="817" text-anchor="middle" fill="#dffffa" font-family="Inter,Arial,sans-serif" font-size="24">Dual-advertise interfaces; migrate consumers progressively.</text>
</svg>
