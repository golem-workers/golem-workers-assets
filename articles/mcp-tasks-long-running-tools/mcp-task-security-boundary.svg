<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MCP task authorization boundary</title><desc id="desc">All task operations pass through subject and tenant authorization before the task store returns state or results.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#172033">A task ID is a locator, not authorization</text>
  <rect x="80" y="180" width="330" height="540" rx="28" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="245" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Requestor</text><text x="245" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">tasks/get</text><text x="245" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">tasks/result</text><text x="245" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">tasks/cancel</text><text x="245" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">tasks/list</text>
  <rect x="520" y="180" width="560" height="540" rx="28" fill="#fef3c7" stroke="#64748b" stroke-width="3"/><text x="800" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Authorization gate</text>
  <rect x="600" y="300" width="400" height="90" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="800" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">subject matches owner</text>
  <rect x="600" y="430" width="400" height="90" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="800" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">tenant matches partition</text>
  <rect x="600" y="560" width="400" height="90" rx="18" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="800" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">operation is allowed</text>
  <rect x="1190" y="180" width="330" height="540" rx="28" fill="#ccfbf1" stroke="#64748b" stroke-width="3"/><text x="1355" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Task store</text><text x="1355" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">state</text><text x="1355" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">result</text><text x="1355" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">expiry</text><text x="1355" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">audit metadata</text>
  <line x1="410" y1="450" x2="515" y2="450" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><line x1="1080" y1="450" x2="1185" y2="450" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="420" y="770" width="760" height="86" rx="20" fill="#fee2e2" stroke="#64748b" stroke-width="2"/><text x="800" y="823" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">Do not query all tasks and filter after retrieval</text>
</svg>
