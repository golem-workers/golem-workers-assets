<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MCP task state machine</title><desc id="desc">Working and input-required task states lead to completed, failed, or cancelled terminal states, with TTL expiry failing closed.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#172033">Treat every task as a durable state machine</text>
  <path d="M380 280H650" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M950 280H1220" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M790 370V525" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M650 610H470" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M930 610H1130" stroke="#64748b" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M650 585C530 520 515 405 650 345" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="520" y="468" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">resume</text>
  <rect x="100" y="200" width="300" height="160" rx="24" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="250" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172033">CreateTaskResult</text><text x="250" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#5b6475">returns a working task</text>
  <rect x="650" y="210" width="300" height="160" rx="24" fill="#c7d2fe" stroke="#64748b" stroke-width="3"/><text x="800" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#172033">working</text><text x="800" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#5b6475">poll at advertised interval</text>
  <rect x="1220" y="210" width="260" height="140" rx="24" fill="#dcfce7" stroke="#64748b" stroke-width="3"/><text x="1350" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">completed</text>
  <rect x="650" y="525" width="300" height="170" rx="24" fill="#fef3c7" stroke="#64748b" stroke-width="3"/><text x="800" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">input_required</text><text x="800" y="638" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#5b6475">pause; request safe input</text>
  <rect x="180" y="540" width="290" height="140" rx="24" fill="#fee2e2" stroke="#64748b" stroke-width="3"/><text x="325" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">failed</text>
  <rect x="1130" y="540" width="290" height="140" rx="24" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/><text x="1275" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">cancelled</text>
  <rect x="470" y="755" width="660" height="88" rx="20" fill="#fecaca" stroke="#64748b" stroke-width="2"/><text x="800" y="810" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">TTL expiry: clean up resources and fail closed</text>
</svg>
