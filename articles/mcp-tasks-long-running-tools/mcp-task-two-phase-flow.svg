<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MCP task two-phase request flow</title><desc id="desc">A requestor creates a task, polls status, and retrieves the deferred tool result from a receiver.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="800" y="74" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#172033">MCP tasks split acceptance from the result</text>
  <rect x="85" y="150" width="350" height="650" rx="28" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><text x="260" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Requestor</text><text x="260" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">client or server</text>
  <rect x="1165" y="150" width="350" height="650" rx="28" fill="#ccfbf1" stroke="#64748b" stroke-width="3"/><text x="1340" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#172033">Receiver</text><text x="1340" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#5b6475">executes and stores state</text>
  <line x1="435" y1="325" x2="1160" y2="325" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="797" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">1. tools/call + task { ttl }</text>
  <line x1="1165" y1="420" x2="440" y2="420" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="797" y="398" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">2. CreateTaskResult</text><text x="797" y="452" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#5b6475">taskId · working · pollInterval</text>
  <line x1="435" y1="545" x2="1160" y2="545" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="797" y="523" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">3. tasks/get polling</text>
  <line x1="1165" y1="635" x2="440" y2="635" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="797" y="613" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">4. completed | failed | cancelled</text>
  <line x1="435" y1="735" x2="1160" y2="735" stroke="#64748b" stroke-width="5" marker-end="url(#arrow)"/><text x="797" y="713" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">5. tasks/result</text>
  <rect x="515" y="785" width="570" height="72" rx="18" fill="#ede9fe" stroke="#64748b" stroke-width="2"/><text x="800" y="830" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">Result shape matches the original request</text>
</svg>
